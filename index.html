    // --- ★ Supabase 雲端非同步數據函數 (加入錯誤捕捉安全鎖) ★ ---
    async function fetchCloudLeaderboard() {
        if (!isCloudConnected || !supabase) {

                cloudLeaderboardCache = data ? JSON.parse(data) : [];
                cloudLeaderboardCache.sort((a,b) => b.score - a.score);
            } catch(e) { cloudLeaderboardCache = []; }
            renderLeaderboardToDOM();
        }
    }

    async function saveScoreToCloud(className, studentId, finalScore) {
        // 先寫入本地備份，雙重保障
        try {
            let leaderboard = localStorage.getItem('mathGameLeaderboardBackup');
            leaderboard = leaderboard ? JSON.parse(leaderboard) : [];
            const idx = leaderboard.findIndex(p => p.class === className && p.id === studentId);
            if (idx > -1) {
                leaderboard[idx].playsCount = (leaderboard[idx].playsCount || 1) + 1;
                leaderboard[idx].score = Math.max(leaderboard[idx].score, finalScore);
            } else {
                leaderboard.push({ class: className, id: studentId, score: finalScore, playsCount: 1 });
            }
            localStorage.setItem('mathGameLeaderboardBackup', JSON.stringify(leaderboard));
        } catch(e) { console.error("本機備份儲存失敗", e); }
        
        if (!isCloudConnected || !supabase) return;

        try {
            const { data: existingRecords, error: fetchError } = await supabase
                .from('leaderboard')
                .select('*')
                .eq('class', className)
                .eq('student_id', studentId);

            if (fetchError) throw fetchError;

            if (existingRecords && existingRecords.length > 0) {
                const record = existingRecords[0];
                const updatedScore = Math.max(record.score, finalScore);
                const updatedPlays = (record.plays_count || 1) + 1;
                const { error: updateError } = await supabase
                    .from('leaderboard')
                    .update({ score: updatedScore, plays_count: updatedPlays })
                    .eq('id', record.id);
                if (updateError) throw updateError;
            } else {
                const { error: insertError } = await supabase
                    .from('leaderboard')
                    .insert([{ 
                        class: className, 
                        student_id: studentId, 
                        score: finalScore, 
                        plays_count: 1 
                    }]);
                if (insertError) throw insertError;
            }
            
            await fetchCloudLeaderboard();
        } catch (err) {
            console.error("上傳至 Supabase 失敗:", err);
        }
    }
